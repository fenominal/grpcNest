// hero/hero.proto
syntax = "proto3";

package PROJECT1;

service PROJECT1Service {
  rpc FindOne (HeroById) returns (Hero) {}
  rpc array(Empty) returns (HeroArray) {}
  rpc findMany( HeroById) returns ( HeroArray) {}
  rpc nested(Empty) returns(nestedType) {}
  rpc enum(Empty) returns(EnumType) {}
  rpc getFirstCommand (getFirstCommandRequest) returns (getFirstCommandResponse) {}
  rpc getFirstquery (getFirstqueryRequest) returns (getFirstqueryResponse) {}
}

message getFirstCommandRequest{
  int32 id=1;
}

message  getFirstCommandResponse{
  string data=1;
  string message=2;
  repeated string error=3;
  int32 status=4;
}

message getFirstqueryRequest{
  
}

message getFirstqueryResponse{
  Hero data=1;
  string message=2;
  repeated string error=3;
  int32 status=4;
}

message HeroById {
  int32 id=1;
}
message nestedType {
  Hero data=1;
}
message Hero {
  int32 id=1;
  string name = 2;
  optional string error=3;
}
message Empty {}
message HeroArray{
  repeated Hero hero=1;
}
message EnumType {
  enum PAYMENT_SYSTEM{
    CASH = 0;
    CREDIT_CARD = 1;
    DEBIT_CARD = 2;
    APP = 3;  
 }
 PAYMENT_SYSTEM payment = 1;
}  
message test {
  string hello=1;
}